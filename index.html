<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatorio de Plenos · Viladecans</title>
  <style>
    :root { --bg: #0f172a; --sf: #1e293b; --fg: #f8fafc; --mut: #94a3b8; --bd: #334155; --ac: #38bdf8; --ok: #10b981; --ko: #ef4444; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
    .card { background: var(--sf); border: 1px solid var(--bd); padding: 24px; border-radius: 12px; max-width: 900px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: var(--mut); font-size: 14px; }
    .status { padding: 12px; background: rgba(16,185,129,0.1); border: 1px solid var(--ok); color: var(--ok); border-radius: 8px; margin-top: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Observatorio de Plenos · Ayuntamiento de Viladecans</h1>
    <p>Sistema institucional y analítico conectado correctamente con Supabase.</p>
    <div id="sts" class="status">Comprobando base de datos...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script>
    function st(t) { document.getElementById("sts").textContent = t; }
    if (!window.supabase || !window.OBS_CONFIG) {
      st("Error: Faltan las librerías o el archivo js/config.js");
    } else {
      var client = window.supabase.createClient(OBS_CONFIG.url, OBS_CONFIG.anonKey);
      client.from("observatorio_data").select("updated_at").eq("id", 1).single()
        .then(function(res) {
          if (res.error) {
            st("Conectado a Supabase, pero falta ejecutar supabase-schema.sql en el SQL Editor.");
          } else {
            st("✓ Conexión establecida con éxito. Base de datos operativa.");
          }
        });
    }
  </script>
</body>
</html>
