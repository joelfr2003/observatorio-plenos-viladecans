<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#14283f"><meta name="description" content="Consulta las sesiones y votaciones del pleno municipal de Viladecans."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Observatorio de plenos · Viladecans</title><style id="css">

</style></head><body><template id="tpl"><header><div class="in">
<h1>Observatorio de plenos municipales · Viladecans</h1>
<div class="sub">Votaciones por sesión, órgano, legislatura y grupo político</div>

</div></header>
<main>
<div id="fb"></div>

<section id="v-consistorio" hidden><div id="co"></div></section>

<input type="date" id="pf"><select id="pt"><option>Ordinario</option><option>Extraordinario</option><option>VIQUAL</option><option>VIMED</option></select><input id="pu" class="x" placeholder="Enlace al acta (opcional)"><button class="p" onclick="addP()">Añadir</button></div></div>
<div class="card"><div class="ch"><h2>Añadir votación</h2></div><div class="r">
<select id="vp"></select><input id="vn" placeholder="Punto" style="width:80px"><input id="va" class="x" placeholder="Asunto">
<input type="number" id="vf" placeholder="Sí" min="0"><input type="number" id="vc" placeholder="No" min="0"><input type="number" id="vb" placeholder="Abst." min="0">
<input id="vq" class="x" placeholder="Partidos: PSC:si, ERC:no, PP:abst" style="flex-basis:100%"><button class="p" onclick="addV()">Añadir</button></div></div>
<div class="card"><div class="ch"><h2>Añadir grupo municipal a una legislatura</h2></div><div class="r">
<select id="gl"></select><input id="gp" placeholder="Partido" style="width:110px"><input type="number" id="gn" placeholder="Concejales" min="0" style="width:105px"><input id="gr" class="x" placeholder="Representantes (separados por comas)"><button class="p" onclick="addG()">Añadir</button></div>
<p class="m" style="padding-bottom:12px">Si el grupo ya existe en esa legislatura, se sustituye.</p></div>
<div class="card"><div class="ch"><h2>Importar / exportar JSON</h2></div>
<p class="m">Admite una lista de sesiones o un objeto {"plenos":[…],"legislaturas":[{"id":"2023-2027","grupos":[{"partido":"PSC","concejales":11,"representantes":["…"]}]}]}. La sesión se identifica por fecha y tipo (Ordinario, Extraordinario, VIQUAL o VIMED).</p><br>
<textarea id="ij"></textarea><div class="r"><input type="file" id="if" accept=".json"><button class="p" onclick="imp()">Importar</button><button onclick="exp()">Exportar</button><button onclick="demo()">Ejemplo ficticio</button><button onclick="clr()">Borrar todo</button></div></div>
</div></section></main></template><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/config.js"></script><script id="app">
document.body.insertBefore($("tpl").content.cloneNode(true),document.body.firstChild);
var K="plenos-viladecans",K2="leg-viladecans",LG="",TP="",PS="",PK=[],tab="plenos";
var L={favor:"A favor",contra:"En contra",abst:"Abstención"},CL={favor:"ok",contra:"ko",abst:"ab"},CT=["Ordinario","Extraordinario","VIQUAL","VIMED"];
var PAL=["#1f5fa8","#c0392b","#2e8b57","#d68910","#7d3c98","#117a8b","#8e6e53","#5d6d7e","#b03a77","#4a7c1f"];
var DEF=[["2011-2015","2011-06-11","2015-06-12"],["2015-2019","2015-06-13","2019-06-14"],["2019-2023","2019-06-15","2023-06-16"],["2023-2027","2023-06-17","2027-06-30"]];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}}
var D=ld(K,[]),G=ld(K2,[]),IS_ADMIN=false,CURRENT_USER=null,SUPA=null,CHANNEL=null,SAVING=false;
DEF.forEach(function(d){if(!G.some(function(g){return g.id==d[0]}))G.push({id:d[0],nombre:"Legislatura "+d[0],inicio:d[1],fin:d[2],grupos:[]})});
function st(t){var e=$("sts");if(e)e.textContent=t}
function sv(){try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(K2,JSON.stringify(G))}catch(e){};if(!IS_ADMIN||!SUPA){st("No se ha guardado en la nube: inicia sesión como administrador.");return}saveCloud()}
async function saveCloud(){if(SAVING)return;SAVING=true;st("Guardando cambios en la base de datos…");var r=await SUPA.from("observatorio_data").update({plenos:D,legislaturas:G,updated_at:new Date().toISOString()}).eq("id",1);SAVING=false;if(r.error){st("Error al guardar: "+r.error.message);return}st("Cambios guardados y publicados para todos los usuarios.")}
async function loadCloud(showStatus){if(!SUPA)return;var r=await SUPA.from("observatorio_data").select("plenos,legislaturas,updated_at").eq("id",1).single();if(r.error){st("No se pudieron cargar los datos. Comprueba que has ejecutado supabase-schema.sql. "+r.error.message);return}D=r.data.plenos||[];G=r.data.legislaturas||[];DEF.forEach(function(d){if(!G.some(function(g){return g.id==d[0]}))G.push({id:d[0],nombre:"Legislatura "+d[0],inicio:d[1],fin:d[2],grupos:[]})});try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(K2,JSON.stringify(G))}catch(e){};render();if(showStatus!==false)st("Datos sincronizados · última actualización: "+(r.data.updated_at?new Date(r.data.updated_at).toLocaleString("es-ES"):"sin fecha"))}
async function refreshAuth(session){CURRENT_USER=session&&session.user?session.user:null;IS_ADMIN=false;if(CURRENT_USER){var a=await SUPA.from("observatorio_admins").select("user_id").eq("user_id",CURRENT_USER.id).maybeSingle();IS_ADMIN=!!(a.data&&!a.error)}$("loginBox").hidden=!!CURRENT_USER&&IS_ADMIN;$("sessionBox").hidden=!CURRENT_USER;$("adminEditor").hidden=!IS_ADMIN;$("authState").textContent=IS_ADMIN?"Administrador conectado":(CURRENT_USER?"Cuenta sin permisos de administrador":"Consulta pública");$("signedAs").textContent=CURRENT_USER?CURRENT_USER.email:"";if(CURRENT_USER&&!IS_ADMIN)st("Esta cuenta no tiene permisos de administración.");else if(IS_ADMIN)st("Sesión de administrador activa.");render()}
async function login(e){e.preventDefault();var email=$("adminEmail").value,password=$("adminPassword").value;st("Iniciando sesión…");var r=await SUPA.auth.signInWithPassword({email:email,password:password});if(r.error){st("No se pudo iniciar sesión: "+r.error.message);return}$("adminPassword").value="";await refreshAuth(r.data.session);if(!IS_ADMIN){await SUPA.auth.signOut();await refreshAuth(null)}}
async function logout(){await SUPA.auth.signOut();await refreshAuth(null)}
function bootSupabase(){if(!window.supabase||!window.OBS_CONFIG||!OBS_CONFIG.url||!OBS_CONFIG.anonKey||OBS_CONFIG.anonKey.indexOf("PEGA_AQUI")===0){st("Falta configurar js/config.js con la URL y la clave pública de Supabase.");return}SUPA=window.supabase.createClient(OBS_CONFIG.url,OBS_CONFIG.anonKey);SUPA.auth.getSession().then(function(r){refreshAuth(r.data.session);loadCloud()});SUPA.auth.onAuthStateChange(function(ev,session){setTimeout(function(){refreshAuth(session)},0)});CHANNEL=SUPA.channel("observatorio-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"observatorio_data",filter:"id=eq.1"},function(){if(!SAVING)loadCloud(false)}).subscribe()}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function res(v){if(v.resultado)return v.resultado;return (+v.favor||0)>(+v.contra||0)?"Aprobado":"Rechazado"}
function fd(s){var p=s.split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:s}
function cat(p){var t=(p.tipo||"").toLowerCase();return t.indexOf("viqual")>-1?"VIQUAL":t.indexOf("vimed")>-1?"VIMED":t.indexOf("extra")>-1?"Extraordinario":"Ordinario"}
function legOf(f){var g=G.filter(function(x){return f>=x.inicio&&f<=x.fin})[0];return g?g.id:""}
function col(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%1000;return PAL[h%PAL.length]}
function nv(x){var s=String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();if(/^(si|s$|f|a favor)/.test(s))return"favor";if(/^(n|c|en contra)/.test(s))return"contra";if(/^(ab|a$)/.test(s))return"abst";return""}
function pq(t){var o={};String(t||"").split(",").forEach(function(x){var a=x.split(":");if(a.length>1&&a[0].trim()&&nv(a[1]))o[a[0].trim()]=nv(a[1])});return o}
function pts(v){var p=v.partidos;if(!p)return"";var g={favor:[],contra:[],abst:[]};Object.keys(p).forEach(function(k){var s=nv(p[k]);if(g[s])g[s].push(k)});
  return["favor","contra","abst"].filter(function(s){return g[s].length}).map(function(s){return'<b class="'+CL[s]+'">'+L[s]+':</b> '+g[s].map(esc).join(", ")}).join("<br>")}
function fp(){return D.filter(function(p){return(!LG||legOf(p.fecha)==LG)&&(!TP||cat(p)==TP)})}
function stats(){var m={};fp().forEach(function(p){(p.votaciones||[]).forEach(function(v){var q=v.partidos||{};Object.keys(q).forEach(function(k){var s=nv(q[k]);if(!s)return;var e=m[k]||(m[k]={favor:[],contra:[],abst:[]});e[s].push({f:p.fecha,c:cat(p),n:v.punto,a:v.asunto,r:res(v)})})})});return m}
function tot(e){return e.favor.length+e.contra.length+e.abst.length}
function pc(n,t){return t?Math.round(n*100/t):0}
function show(t){tab=t;["plenos","partidos","consistorio","datos"].forEach(function(x){$("v-"+x).hidden=x!=t;$("t-"+x).className=x==t?"on":""});$("fb").hidden=(t=="datos"||t=="consistorio");render()}
function setL(v){LG=v;render()}function setT(v){TP=v;render()}
function rf(){var h='<select onchange="setL(this.value)"><option value="">Todas las legislaturas</option>'+G.slice().sort(function(a,b){return b.id.localeCompare(a.id)}).map(function(g){return'<option value="'+esc(g.id)+'"'+(g.id==LG?" selected":"")+">"+esc(g.nombre)+"</option>"}).join("")+"</select>";
  h+='<div class="chips">'+[""].concat(CT).map(function(c){var n=D.filter(function(p){return(!LG||legOf(p.fecha)==LG)&&(!c||cat(p)==c)}).length;return'<button class="'+(TP==c?"sel":"")+'" onclick="setT(\''+c+'\')">'+(c||"Todos")+" ("+n+")</button>"}).join("")+"</div>";$("fb").innerHTML=h}
function rk(){var f=fp(),n=0;f.forEach(function(p){n+=(p.votaciones||[]).length});
  $("kp").innerHTML=[[f.length,"Sesiones"],[n,"Votaciones"],[Object.keys(stats()).length,"Partidos"],[LG||"Todas","Legislatura"]].map(function(x){return"<div><b>"+esc(x[0])+"</b><span>"+x[1]+"</span></div>"}).join("")}
function rp(){var q=$("sq").value.toLowerCase().trim(),h="";
  fp().forEach(function(p){var i=D.indexOf(p),vs=(p.votaciones||[]).map(function(v,j){return{v:v,j:j}}).filter(function(o){return!q||(o.v.asunto||"").toLowerCase().indexOf(q)>-1||Object.keys(o.v.partidos||{}).join(" ").toLowerCase().indexOf(q)>-1});
    if(q&&!vs.length)return;
    var rows=vs.map(function(o){var v=o.v,r=res(v),k=/aprob/i.test(r)?"ok":"ko";
      return"<tr><td>"+esc(v.punto)+"</td><td>"+esc(v.asunto)+'</td><td class="n">'+(v.favor==null?"":v.favor)+'</td><td class="n">'+(v.contra==null?"":v.contra)+'</td><td class="n">'+(v.abst==null?"":v.abst)+'</td><td><span class="tag '+k+'">'+esc(r)+'</span></td><td class="pt">'+pts(v)+'</td><td><button onclick="dv('+i+","+o.j+')">✕</button></td></tr>'}).join("");
    h+='<div class="card"><div class="ch"><h2>'+esc(fd(p.fecha))+' <span class="tag c">'+cat(p)+"</span> <small>· "+legOf(p.fecha)+" · "+(p.votaciones||[]).length+' votaciones</small></h2><span>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">Ver acta</a> ':"")+(IS_ADMIN?'<button onclick="dp('+i+')">Eliminar</button>':'')+'</span></div><div class="w"><table><tr><th>Punto</th><th>Asunto</th><th class="n">Sí</th><th class="n">No</th><th class="n">Abst.</th><th>Resultado</th><th>Voto por partido</th><th></th></tr>'+(rows||'<tr><td colspan="8" class="e">Sin votaciones registradas</td></tr>')+"</table></div></div>"});
  $("pl").innerHTML=h||'<div class="card"><div class="e">No hay sesiones con estos filtros. Ve a «Datos» para añadir actas o cargar el ejemplo.</div></div>'}
function rt(){var m=stats();PK=Object.keys(m).sort(function(a,b){return tot(m[b])-tot(m[a])||a.localeCompare(b)});
  if(!PK.length){$("pa").innerHTML='<div class="card"><div class="e">Sin votos por partido con estos filtros.</div></div>';return}
  if(PS&&!m[PS])PS="";
  var h='<div class="card"><div class="ch"><h2>Votaciones de un partido</h2><select onchange="PS=this.value;rt()"><option value="">Selecciona un partido…</option>'+PK.map(function(k){return'<option'+(k==PS?" selected":"")+">"+esc(k)+"</option>"}).join("")+"</select></div>";
  if(PS){var e=m[PS],t=tot(e);h+='<div class="cols">'+["favor","contra","abst"].map(function(s){
    return'<div class="col"><h3 class="'+CL[s]+'">'+L[s]+" · "+e[s].length+" ("+pc(e[s].length,t)+"%)</h3>"+(e[s].length?e[s].slice().sort(function(a,b){return b.f.localeCompare(a.f)}).map(function(x){return'<div class="it"><small>'+esc(fd(x.f))+" · "+x.c+" · punto "+esc(x.n)+"</small><br>"+esc(x.a)+' <span class="tag '+(/aprob/i.test(x.r)?"ok":"ko")+'">'+esc(x.r)+"</span></div>"}).join(""):'<div class="e">Ninguna</div>')+"</div>"}).join("")+"</div>"}
  else h+='<div class="e">Elige un partido para ver en qué votó a favor, en contra o se abstuvo.</div>';
  h+='</div><div class="card"><div class="ch"><h2>Resumen por grupo</h2><small>Pulsa una fila para seleccionarlo</small></div><div class="w"><table><tr><th>Partido</th><th class="n">Votaciones</th><th class="n ok">A favor</th><th class="n ko">En contra</th><th class="n ab">Abst.</th><th>Distribución</th></tr>';
  PK.forEach(function(k,i){var e=m[k],t=tot(e);h+='<tr class="cl'+(k==PS?" sl":"")+'" onclick="PS=PK['+i+'];rt()"><td><b>'+esc(k)+'</b></td><td class="n">'+t+"</td>"+["favor","contra","abst"].map(function(s){return'<td class="n"><b class="'+CL[s]+'">'+e[s].length+"</b> <small>("+pc(e[s].length,t)+"%)</small></td>"}).join("")
    +'<td><div class="bar"><i class="f" style="width:'+pc(e.favor.length,t)+'%"></i><i class="c" style="width:'+pc(e.contra.length,t)+'%"></i><i class="a" style="width:'+pc(e.abst.length,t)+'%"></i></div></td></tr>'});
  $("pa").innerHTML=h+"</table></div></div>"}
function dots(g){var h="";(g.grupos||[]).forEach(function(x){for(var i=0;i<(+x.concejales||0);i++)h+='<span class="dot" style="background:'+col(x.partido)+'" title="'+esc(x.partido)+'"></span>'});return h||'<small class="m" style="padding:0">Composición sin definir</small>'}
function seats(g){var n=0;(g.grupos||[]).forEach(function(x){n+=+x.concejales||0});return n}
function ent(i){LG=G[i].id;render()}
function rc(){var h="";
