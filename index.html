<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatorio del Pleno · Viladecans</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Observatorio de Plenos · Viladecans</h1>
    <p id="sts">Conectando con Supabase y cargando el sistema...</p>
    <button onclick="location.reload()">Recargar Aplicación</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script>
    function st(t) { document.getElementById("sts").textContent = t; }
    if (!window.OBS_CONFIG || !OBS_CONFIG.url) {
      st("Falta configurar js/config.js con las claves de Supabase.");
    } else {
      st("Conexión con Supabase correcta. El sistema está activo.");
    }
  </script>
</body>
</html>
